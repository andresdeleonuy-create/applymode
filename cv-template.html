<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>CV</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 40px;
    color: #1a1a1a;
    line-height: 1.5;
  }
  h1 { font-size: 28px; margin: 0 0 2px; }
  .rol { font-size: 15px; color: #555; margin: 0 0 14px; }
  .contacto { font-size: 12px; color: #444; margin-bottom: 28px; }
  .contacto span:not(:last-child)::after { content: " · "; color: #aaa; }
  h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
    color: #555; border-bottom: 1px solid #ccc; padding-bottom: 4px; margin: 26px 0 10px;
  }
  p { font-size: 13.5px; margin: 0 0 10px; white-space: pre-wrap; }
  .skills { display: flex; flex-wrap: wrap; gap: 6px; }
  .skill { font-size: 12px; border: 1px solid #ccc; border-radius: 999px; padding: 3px 10px; }
  .toolbar {
    position: fixed; top: 16px; right: 16px; display: flex; gap: 8px;
  }
  .toolbar button {
    padding: 10px 16px; border-radius: 6px; border: none; background: #1a1a1a; color: #fff;
    font-family: system-ui, sans-serif; font-size: 13px; cursor: pointer;
  }
  .instrucciones {
    position: fixed; top: 64px; right: 16px; max-width: 220px; font-family: system-ui, sans-serif;
    font-size: 11px; color: #666; background: #f5f5f5; border-radius: 6px; padding: 10px 12px; line-height: 1.4;
  }
  #empty { font-family: system-ui, sans-serif; color: #666; }

  @media print {
    .toolbar, .instrucciones { display: none; }
    body { padding: 0; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <button id="printBtn">Imprimir / Guardar como PDF</button>
  </div>
  <div class="instrucciones">
    Elegí "Guardar como PDF" como destino, guardalo, y volvé a Opciones para subirlo a este perfil.
  </div>

  <div id="content"><p id="empty">Cargando...</p></div>

  <script src="cv-template.js"></script>
</body>
</html>
